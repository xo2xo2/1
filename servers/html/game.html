<style>

  .angry-grid {

    display: grid;

    grid-template-rows: 1fr 1fr;

    grid-template-columns: 1fr 1fr 1fr 1fr 1fr;

    gap: 1px;

    justify-content: center;

    align-items: center;

    justify-items: center;

    align-content: center;

    border-bottom: 1px solid #fff;

  }



  .angry-grid a.active {

    border: 2px solid rgb(27, 214, 21);

  }



  .tab-pane {

    display: none;

  }



  .tab-pane.active {

    display: block;

  }



  [id*="wwc_room_item_"]:hover {

    background-color: rgba(0, 0, 0, 0.205);

    color: rgb(255, 255, 255);

  }



  [id*="wwc_room_item_"] a:hover {

    color: black;

  }



  .modal {

    display: none;

    position: fixed;

    top: 0;

    right: 0;

    bottom: 0;

    left: 0;

    padding: 15px;

    overflow: auto;

    background-color: rgba(0, 0, 0, 0.88);

    -webkit-animation-duration: 0.35s;

    animation-duration: 0.35s;

    -webkit-animation-fill-mode: both;

    animation-fill-mode: both;

    -webkit-animation-name: fadeIn;

    animation-name: fadeIn;

    /* Modifiers */

    /* States */

  }



  .modal__dialog {

    position: relative;

    max-width: 500px;

    padding: 20px;

    margin: auto;

    border-radius: 4px;

    background-color: #fff;

  }



  .modal__close {

    position: absolute;

    top: 20px;

    right: 20px;

    padding: 0;

    border: none;

    color: #ccc;

    background-color: transparent;

    background-image: none;

  }



  .modal__close:focus {

    outline: 0;

  }



  .modal__header {

    border-bottom: 1px solid #e2e2e2;

  }



  .modal__title {

    margin: 0 0 15px;

  }



  .modal__content {

    padding: 10px 0;

    font-size: 13px;

    line-height: 1.6;

    color: #555;

  }



  .modal__footer {

    padding-top: 20px;

    border-top: 1px solid #e2e2e2;

    text-align: right;

  }



  .modal--fullscreen {

    padding: 5px;

  }



  .modal--fullscreen .modal__dialog {

    width: 100%;

    max-width: none;

    height: 100%;

    border-radius: 0;

  }



  .modal.is-modal-active {

    display: flex;

  }



  .apoio-aqui {

    display: flex;

    align-content: center;

    justify-content: space-around;

    align-items: center;

    flex-wrap: nowrap;

    flex-direction: row;

    border-bottom: 2px solid #fff;

    padding-bottom: 8px;

  }



  .sprite {

    background-image: url(https://asserts.wormworld.io/images/flags_region.png);

    background-repeat: no-repeat;

    background-size: 135px 120px;

    display: block;

    margin: 6px 0;

  }



  .sprite-ae-flag {

    width: 40px;

    height: 25px;

    background-position: -3px -4px;

  }



  .sprite-au-flag {

    width: 40px;

    height: 25px;

    background-position: -48px -3px;

  }



  .sprite-br-flag {

    width: 40px;

    height: 25px;

    background-position: -2px -33px;

  }



  .sprite-ca-flag {

    width: 40px;

    height: 25px;

    background-position: -48px -33px;

  }



  .sprite-fr-flag {

    width: 40px;

    height: 25px;

    background-position: -2px -62px;

  }



  .sprite-de-flag {

    width: 40px;

    height: 25px;

    background-position: -48px -62px;

  }



  .sprite-jp-flag {

    width: 40px;

  .sprite-mx-flag {

  .sprite-sg-flag {

  .sprite-uk-flag {

    width: 40px;

  .sprite-us-flag {

    width: 40px;

    height: 25px;

    background-position: -92px -92px;

  }

</style>
</head>
<body>
<div id="load_page_apoiador">
<div class="title-worm-world-connect" style="position: absolute; background-color: rgba(255, 255, 255, 0.966); color:red; height: 28px; text-align: center; border-radius: 5px; top: 3px; line-height: 28px; font-size: 15px;text-shadow: 0 0 1px #ff0000; z-index: 1; width: 95%">

    WormXO connect

  </div>
<div id="wwc_tabs" style="height: 250px; overflow: auto; border-radius: 7px; border: 1px solid; margin: 6px auto">
<div class="angry-grid f32">
<a href="#tabs4" id="linktab_4">
<i class="sprite sprite-de-flag"></i>

<a href="#tabs9" id="linktab_9">
<i class="sprite sprite-ae-flag"></i>
</a>
<a href="#tabs0" id="linktab_0">
<i class="sprite sprite-br-flag"></i>
</a>
<a href="#tabs1" id="linktab_1">
<i class="sprite sprite-us-flag"></i>
</a>
<a href="#tabs2" id="linktab_2">
<i class="sprite sprite-ca-flag"></i>
</a>
<a href="#tabs5" id="linktab_5">
<i class="sprite sprite-fr-flag"></i>
</a>
<a href="#tabs3" id="linktab_3">
<i class="sprite sprite-mx-flag"></i>
</a>
<a href="#tabs6" id="linktab_6">
<i class="sprite sprite-sg-flag"></i>
</a>
<a href="#tabs7" id="linktab_7">

<div class="tab-pane" id="tabs0" style="display: none">

<div class="tab-pane" id="tabs1" style="display: none">

</div>
<div class="tab-pane" id="tabs3" style="display: none">
</div>
<div class="tab-pane" id="tabs4" style="display: none">
</div>
<div class="tab-pane" id="tabs5" style="display: none">
</div>
<div class="tab-pane" id="tabs6" style="display: none">
</div>
<div class="tab-pane" id="tabs7" style="display: none">
</div>
<div class="tab-pane" id="tabs8" style="display: none">
</div>
<div class="tab-pane" id="tabs9" style="display: none">
</div>
</div>
</div>
<script>
    const SERVER_JSON_URL = "https://xo.wormy.online/server";

    const TAB_REGION_MAP = {
      tabs0: "br",
      tabs1: "us",
      tabs2: "ca",
      tabs3: "mx",
      tabs4: "de",
      tabs5: "fr",
      tabs6: "sg",
      tabs7: "jp",
      tabs8: "au",
      tabs9: "ae"
    };

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g, function(ch) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "'": "&#39;",
          '"': "&quot;"
        }[ch];
      });
    }

    function normalizeServers(payload) {
      if (Array.isArray(payload)) {
        return payload;
      }

      if (payload && Array.isArray(payload.servers)) {
        return payload.servers;
      }

      return [];
    }

    function buildServerItem(server, fallbackIndex) {
      const number = Number(server.number || fallbackIndex || 1);
      const label = server.label || ((String(number).padStart(2, "0")) + " " + (server.name || "WW"));
      const dataCon = server.data_con || server.dataCon || server.con || "";
      const dataRoom = server.data_room || server.dataRoom || server.room || "";
      const dataType = String(server.data_type ?? server.dataType ?? "false");
      const link = server.link || "https://wormworld.io";
      const image = server.image || "https://asserts.wormworld.io/rooms/favicon128x128.png";

      return `
                        <div id="wwc_room_item_${escapeHtml(number)}" class="server-item" style="
          display: grid;
          grid-template-columns: 1fr 30px;
          line-height: 28px;
        ">
                          <div class="dropdown-item selecionar-sala-v2 server-name" style="cursor: pointer; line-height: 25px"
                            data-con="${escapeHtml(dataCon)}" data-room="${escapeHtml(dataRoom)}"
                            data-type="${escapeHtml(dataType)}">
                            <strong>
                              ${escapeHtml(label)}
                            </strong>
                          </div>
                          <a href="${escapeHtml(link)}" target="_blank">
                            <img src="${escapeHtml(image)}" style="width: 25px; vertical-align: middle" />
                          </a>
                        </div>`;
    }

    function renderServers(servers) {
      const grouped = {};

      Object.keys(TAB_REGION_MAP).forEach(function(tabId) {
        grouped[tabId] = [];
      });

      servers.forEach(function(server, index) {
        const tab = server.tab || Object.keys(TAB_REGION_MAP).find(function(tabId) {
          return TAB_REGION_MAP[tabId] === server.region;
        });

        if (!tab || !grouped[tab]) {
          return;
        }

        grouped[tab].push(server);
      });

      Object.keys(grouped).forEach(function(tabId) {
        const html = grouped[tabId].map(function(server, index) {
          return buildServerItem(server, index + 1);
        }).join("\n");

        $("#" + tabId).html(html || "");
      });

      bindServerEvents();
    }

    function bindServerEvents() {
      $(document).off("click", ".server-name").on("click", ".server-name", function() {
        const serverUrl = $(this).data("con");
        const roomId = $(this).data("room");
        const serverName = $(this).find("strong").text().trim();

        $("#connection-status").html(`جاري الاتصال بـ <strong>${serverName}</strong>...`);
        connectToServer(serverUrl, roomId, serverName);
      });

      $(document).off("mouseenter", ".server-item").on("mouseenter", ".server-item", function() {
        $(this).css("background-color", "rgba(255, 255, 0, 0.2)");
      });

      $(document).off("mouseleave", ".server-item").on("mouseleave", ".server-item", function() {
        $(this).css("background-color", "");
      });
    }

    function loadServers() {
      fetch(SERVER_JSON_URL, { cache: "no-store" })
        .then(function(response) {
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }
          return response.json();
        })
        .then(function(payload) {
          renderServers(normalizeServers(payload));
        })
        .catch(function(error) {
          console.error("فشل تحميل السيرفرات:", error);
          Object.keys(TAB_REGION_MAP).forEach(function(tabId) {
            $("#" + tabId).html("");
          });
        });
    }

    // تهيئة الصفحة

    $(document).ready(function() {

      // تنشيط التبويب الأول افتراضيًا

      $("#linktab_4").addClass("active");

      $("#tabs4").addClass("active").show();

      loadServers();
      bindServerEvents();

      // إضافة حدث النقر على التبويبات

      $(".angry-grid a").on("click", function(e) {

        e.preventDefault();

        let target = $(this).attr("href");

        $(".angry-grid a").removeClass("active");

        $(this).addClass("active");

        $(".tab-pane").removeClass("active").hide();

        $(target).addClass("active").fadeIn();

      });

    });

    // دالة الاتصال بالسيرفر

    function connectToServer(serverUrl, roomId, serverName) {

      console.log(`محاولة الاتصال بالسيرفر: ${serverUrl} (${roomId})`);

      // تغيير مظهر زر السيرفر ليعكس محاولة الاتصال

      $(".server-name").css("border", "none");

      $(`.server-name[data-room="${roomId}"]`).css("border", "1px solid yellow");

      // محاولة الاتصال باستخدام وظيفة اللعبة

      if (window.parent && window.parent._anApp) {

        try {

          console.log("استخدام وظيفة _anApp.bo للاتصال");

          // إيقاف الصوت (إذا كان متاحًا)

          if (window.parent._anApp.Si && typeof window.parent._anApp.Si.Se === 'function') {

            window.parent._anApp.Si.Se();

          }

          // الاتصال بالسيرفر

          if (typeof window.parent._anApp.bo === 'function') {

            window.parent._anApp.bo(serverUrl);

            $("#connection-status").html(`تم الاتصال بنجاح: <strong>${serverName}</strong>`);

            return true;

          }

        } catch (e) {

          console.error("خطأ في الاتصال بالسيرفر:", e);

        }

      }

      // محاولة بديلة للاتصال

      try {

        // محاولة فتح عنوان السيرفر مباشرة

        let httpUrl = serverUrl.replace('wss://', 'https://').replace('ws://', 'http://');

        httpUrl = httpUrl.split('/wormy')[0] + '?room=' + roomId;

        window.open(httpUrl, '_blank');

        $("#connection-status").html(`تم فتح السيرفر في نافذة جديدة: <strong>${serverName}</strong>`);

        return true;

      } catch (e) {

        console.error("فشل في فتح عنوان السيرفر:", e);

        $("#connection-status").html(`فشل الاتصال بالسيرفر: <strong>${serverName}</strong>`);

        return false;

      }

    }

    // وظيفة تنشيط التوكن (إذا كانت مطلوبة)

    function activeToken() {

      window.open("https://wormworld.io/active", "popup");

      setTimeout(function() {

        window.location.reload();

      }, 1000 * 16);

    }
  </script>
