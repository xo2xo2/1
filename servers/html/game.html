<!DOCTYPE html>

<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>  Load Paged</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>

  .angry-grid {

    display: grid;

    grid-template-rows: 1fr 1fr;

    grid-template-columns: 1fr 1fr 1fr 1fr 1fr;

    gap: 1px;

    justify-content: center;

    align-items: center;

    justify-items: center;

    align-content: center;

    border-bottom: 1px solid #fff;

  }



  .angry-grid a.active {

    border: 2px solid rgb(27, 214, 21);

  }



  .tab-pane {

    display: none;

  }



  .tab-pane.active {

    display: block;

  }



  [id*="wwc_room_item_"]:hover {

    background-color: rgba(0, 0, 0, 0.205);

    color: rgb(255, 255, 255);

  }



  [id*="wwc_room_item_"] a:hover {

    color: black;

  }



  .modal {

    display: none;

    position: fixed;

    top: 0;

    right: 0;

    bottom: 0;

    left: 0;

    padding: 15px;

    overflow: auto;

    background-color: rgba(0, 0, 0, 0.88);

    -webkit-animation-duration: 0.35s;

    animation-duration: 0.35s;

    -webkit-animation-fill-mode: both;

    animation-fill-mode: both;

    -webkit-animation-name: fadeIn;

    animation-name: fadeIn;

    /* Modifiers */

    /* States */

  }



  .modal__dialog {

    position: relative;

    max-width: 500px;

    padding: 20px;

    margin: auto;

    border-radius: 4px;

    background-color: #fff;

  }



  .modal__close {

    position: absolute;

    top: 20px;

    right: 20px;

    padding: 0;

    border: none;

    color: #ccc;

    background-color: transparent;

    background-image: none;

  }



  .modal__close:focus {

    outline: 0;

  }



  .modal__header {

    border-bottom: 1px solid #e2e2e2;

  }



  .modal__title {

    margin: 0 0 15px;

  }



  .modal__content {

    padding: 10px 0;

    font-size: 13px;

    line-height: 1.6;

    color: #555;

  }



  .modal__footer {

    padding-top: 20px;

    border-top: 1px solid #e2e2e2;

    text-align: right;

  }



  .modal--fullscreen {

    padding: 5px;

  }



  .modal--fullscreen .modal__dialog {

    width: 100%;

    max-width: none;

    height: 100%;

    border-radius: 0;

  }



  .modal.is-modal-active {

    display: flex;

  }



  .apoio-aqui {

    display: flex;

    align-content: center;

    justify-content: space-around;

    align-items: center;

    flex-wrap: nowrap;

    flex-direction: row;

    border-bottom: 2px solid #fff;

    padding-bottom: 8px;

  }



  .sprite {

    background-image: url(https://asserts.wormworld.io/images/flags_region.png);

    background-repeat: no-repeat;

    background-size: 135px 120px;

    display: block;

    margin: 6px 0;

  }



  .sprite-ae-flag {

    width: 40px;

    height: 25px;

    background-position: -3px -4px;

  }



  .sprite-au-flag {

    width: 40px;

    height: 25px;

    background-position: -48px -3px;

  }



  .sprite-br-flag {

    width: 40px;

    height: 25px;

    background-position: -2px -33px;

  }



  .sprite-ca-flag {

    width: 40px;

    height: 25px;

    background-position: -48px -33px;

  }



  .sprite-fr-flag {

    width: 40px;

    height: 25px;

    background-position: -2px -62px;

  }



  .sprite-de-flag {

    width: 40px;

    height: 25px;

    background-position: -48px -62px;

  }



  .sprite-jp-flag {

    width: 40px;

    height: 25px;

    background-position: -48px -92px;

  }



  .sprite-mx-flag {

    width: 40px;

    height: 25px;

    background-position: -92px -3px;

  }



  .sprite-sg-flag {

    width: 40px;

    height: 25px;

    background-position: -92px -33px;

  }



  .sprite-uk-flag {

    width: 40px;

    height: 25px;

    background-position: -92px -92px;

  }



  .sprite-us-flag {

    width: 40px;

    height: 25px;

    background-position: -92px -92px;

  }

</style>
</head>
<body>
<div id="load_page_apoiador">
<div class="title-worm-world-connect" style="position: absolute; background-color: rgba(255, 255, 255, 0.966); color:red; height: 28px; text-align: center; border-radius: 5px; top: 3px; line-height: 28px; font-size: 15px;text-shadow: 0 0 1px #ff0000; z-index: 1; width: 95%">
<img align="center" alt="" src="https://wormxo.store/image/wxo.png" width="20"/>

    WormXO connect

  </div>
<div id="wwc_tabs" style="height: 250px; overflow: auto; border-radius: 7px; border: 1px solid; margin: 6px auto">
<div class="angry-grid f32">
<a href="#tabs4" id="linktab_4">
<i class="sprite sprite-de-flag"></i>
</a>
<a href="#tabs9" id="linktab_9">
<i class="sprite sprite-ae-flag"></i>
</a>
<a href="#tabs0" id="linktab_0">
<i class="sprite sprite-br-flag"></i>
</a>
<a href="#tabs1" id="linktab_1">
<i class="sprite sprite-us-flag"></i>
</a>
<a href="#tabs2" id="linktab_2">
<i class="sprite sprite-ca-flag"></i>
</a>
<a href="#tabs5" id="linktab_5">
<i class="sprite sprite-fr-flag"></i>
</a>
<a href="#tabs3" id="linktab_3">
<i class="sprite sprite-mx-flag"></i>
</a>
<a href="#tabs6" id="linktab_6">
<i class="sprite sprite-sg-flag"></i>
</a>
<a href="#tabs7" id="linktab_7">
<i class="sprite sprite-jp-flag"></i>
</a>
<a href="#tabs8" id="linktab_8">
<i class="sprite sprite-au-flag"></i>
</a>
</div>
<div class="tab-pane" id="tabs0" style="display: none"></div>
<div class="tab-pane" id="tabs1" style="display: none"></div>
<div class="tab-pane" id="tabs2" style="display: none"></div>
<div class="tab-pane" id="tabs3" style="display: none"></div>
<div class="tab-pane" id="tabs4" style="display: none"></div>
<div class="tab-pane" id="tabs5" style="display: none"></div>
<div class="tab-pane" id="tabs6" style="display: none"></div>
<div class="tab-pane" id="tabs7" style="display: none"></div>
<div class="tab-pane" id="tabs8" style="display: none"></div>
<div class="tab-pane" id="tabs9" style="display: none"></div>
</div>
</div>
<script>

    // تهيئة الصفحة

    $(document).ready(function() {

      // تنشيط التبويب الأول افتراضيًا

      $("#linktab_4").addClass("active");

      $("#tabs4").addClass("active").show();

      loadServersFromRemote();

      

      // إضافة حدث النقر على التبويبات

      $(".angry-grid a").on("click", function(e) {

        e.preventDefault();

        let target = $(this).attr("href");

        $(".angry-grid a").removeClass("active");

        $(this).addClass("active");

        $(".tab-pane").removeClass("active").hide();

        $(target).addClass("active").fadeIn();

      });

      

      // إضافة حدث النقر على السيرفرات

      $(document).on("click", ".server-name, .selecionar-sala-v2", function() {

        const serverUrl = $(this).data("con");

        const roomId = $(this).data("room");

        const serverName = $(this).find("strong").text();

        

        // عرض معلومات الاتصال

        $("#connection-status").html(`جاري الاتصال بـ <strong>${serverName}</strong>...`);

        

        // محاولة الاتصال بالسيرفر

        connectToServer(serverUrl, roomId, serverName);

      });

      

      // إضافة تأثيرات بصرية للسيرفرات

      $(document).on("mouseenter", ".server-item, [id*='wwc_room_item_']", function() {

        $(this).css("background-color", "rgba(255, 255, 0, 0.2)");

      }).on("mouseleave", ".server-item, [id*='wwc_room_item_']", function() {

        $(this).css("background-color", "");

      });

    });

    

    const SERVERS_JSON_URL = "https://xo.wormy.online/server";

    function serverText(value) {
      return value == null ? "" : String(value);
    }

    function escapeHtml(value) {
      return serverText(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalizeServer(server, index) {
      const region = serverText(server.region || server.category || "").toLowerCase();
      const tab = serverText(server.tab || (region ? "tabs" + region : ""));
      const number = Number(server.number || server.id || index + 1);
      const rawName = serverText(server.name || server.label || "WW");
      const label = serverText(server.label || ((number < 10 ? "0" + number : number) + " &nbsp;" + rawName));
      return {
        region: region,
        tab: tab,
        number: number,
        name: rawName,
        label: label,
        data_con: serverText(server.data_con || server.serverUrl || server.connection || server.url),
        data_room: serverText(server.data_room || server.room || server.roomId),
        data_type: serverText(server.data_type || server.type || "false"),
        link: serverText(server.link || server.socialLink || "https://wormworld.io"),
        image: serverText(server.image || server.img || "https://asserts.wormworld.io/rooms/favicon128x128.png")
      };
    }

    function tabByRegion(region) {
      const map = {
        br: "tabs0",
        us: "tabs1",
        ca: "tabs2",
        mx: "tabs3",
        de: "tabs4",
        fr: "tabs5",
        sg: "tabs6",
        jp: "tabs7",
        au: "tabs8",
        ae: "tabs9"
      };
      return map[region] || "tabs4";
    }

    function createServerHtml(server) {
      const tabId = server.tab || tabByRegion(server.region);
      const itemId = "wwc_room_item_" + escapeHtml(server.number);
      return `\n                        <div id="${itemId}" class="server-item" style="\n          display: grid;\n          grid-template-columns: 1fr 30px;\n          line-height: 28px;\n        ">\n                          <div class="dropdown-item selecionar-sala-v2 server-name" style="cursor: pointer; line-height: 25px"\n                            data-con="${escapeHtml(server.data_con)}" data-room="${escapeHtml(server.data_room)}"\n                            data-type="${escapeHtml(server.data_type)}">\n                            <strong>\n                              ${server.label}\n                            </strong>\n                          </div>\n                          <a href="${escapeHtml(server.link)}" target="_blank">\n                            <img src="${escapeHtml(server.image)}" style="width: 25px; vertical-align: middle" />\n                          </a>\n                        </div>`;
    }

    function loadServersFromRemote() {
      return $.getJSON(SERVERS_JSON_URL)
        .then(function(data) {
          const servers = Array.isArray(data) ? data : (Array.isArray(data.servers) ? data.servers : []);
          $(".tab-pane").empty();
          servers.forEach(function(item, index) {
            const server = normalizeServer(item, index);
            const targetTab = server.tab || tabByRegion(server.region);
            const pane = $("#" + targetTab);
            if (pane.length) {
              pane.append(createServerHtml(server));
            }
          });
        })
        .catch(function(error) {
          console.error("Failed to load servers:", error);
        });
    }

    // دالة الاتصال بالسيرفر

    function connectToServer(serverUrl, roomId, serverName) {

      console.log(`محاولة الاتصال بالسيرفر: ${serverUrl} (${roomId})`);

      $(".server-name").css("border", "none");

      $(`.server-name[data-room="${roomId}"]`).css("border", "1px solid yellow");

      if ($("#connection-status").length) {
        $("#connection-status").html(`جاري الاتصال بـ <strong>${serverName}</strong>...`);
      }

      try {
        if (window.parent && window.parent._anApp) {

          console.log("استخدام وظيفة _anApp للاتصال");

          if (window.parent._anApp.Si && typeof window.parent._anApp.Si.Se === 'function') {
            window.parent._anApp.Si.Se();
          }

          if (typeof window.parent._anApp.bo === 'function') {
            window.parent._anApp.bo(serverUrl);
            if ($("#connection-status").length) {
              $("#connection-status").html(`تم الاتصال بنجاح: <strong>${serverName}</strong>`);
            }
            return true;
          }

          if (typeof window.parent._anApp.connect === 'function') {
            window.parent._anApp.connect(serverUrl, roomId);
            if ($("#connection-status").length) {
              $("#connection-status").html(`تم الاتصال بنجاح: <strong>${serverName}</strong>`);
            }
            return true;
          }
        }
      } catch (e) {
        console.error("خطأ في الاتصال بالسيرفر:", e);
      }

      try {
        if (typeof window._anApp !== 'undefined') {
          if (window._anApp.Si && typeof window._anApp.Si.Se === 'function') {
            window._anApp.Si.Se();
          }

          if (typeof window._anApp.bo === 'function') {
            window._anApp.bo(serverUrl);
            if ($("#connection-status").length) {
              $("#connection-status").html(`تم الاتصال بنجاح: <strong>${serverName}</strong>`);
            }
            return true;
          }

          if (typeof window._anApp.connect === 'function') {
            window._anApp.connect(serverUrl, roomId);
            if ($("#connection-status").length) {
              $("#connection-status").html(`تم الاتصال بنجاح: <strong>${serverName}</strong>`);
            }
            return true;
          }
        }
      } catch (e) {
        console.error("خطأ في الاتصال المحلي بالسيرفر:", e);
      }

      console.warn("لم يتم العثور على دالة اتصال اللعبة، لن يتم فتح رابط خارجي.");
      if ($("#connection-status").length) {
        $("#connection-status").html(`لم يتم العثور على دالة اتصال اللعبة: <strong>${serverName}</strong>`);
      }
      return false;

    }

    // وظيفة تنشيط التوكن (إذا كانت مطلوبة)

    function activeToken() {

      window.open("https://wormworld.io/active", "popup");

      setTimeout(function() {

        window.location.reload();

      }, 1000 * 16);

    }

  </script>
</body>
</html>
